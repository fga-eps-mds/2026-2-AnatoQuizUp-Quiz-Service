name: CI - Quiz-Service



on:

  push:

    branches: [main, develop]

  pull_request:

    branches: [main, develop]



jobs:

  ci:

    name: Lint, Build, Test e SonarCloud

    runs-on: ubuntu-latest



    services:

      postgres:

        image: postgres:16

        env:

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: postgres

          POSTGRES_DB: anatoquizup_quiz_test

        ports:

          - 5432:5432

        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5


    env:

      NODE_ENV: test

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anatoquizup_quiz_test?schema=public

      JWT_SECRET_KEY: ci-test-secret
      INTERNAL_TOKEN: ci-test-internal-token


    steps:

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version-file: ".nvmrc"

          cache: "npm"



      - name: Instalar dependências

        run: npm ci



      - name: Rodar ESLint

        run: npm run lint



      - name: Gerar Prisma Client

        run: npm run prisma:generate

      - name: Criar tabelas no banco de testes
        run: npx prisma db push



      - name: Build do projeto

        run: |

          if [ "$(npm pkg get scripts.build)" != "{}" ]; then

            npm run build

          else

            echo "Sem script de build configurado. Pulando."

          fi



      - name: Rodar testes com cobertura

        run: |

          if [ "$(npm pkg get scripts.test)" != "{}" ]; then
            # 2. ADICIONE A FLAG --runInBand AQUI
            npm test -- --coverage --passWithNoTests --runInBand
          else
            echo "Sem script de teste configurado. Pulando."
          fi



      - name: Verificar cobertura mínima (85%)

        run: |

          if [ ! -f coverage/coverage-summary.json ]; then

            echo "::warning::coverage-summary.json não encontrado. Verifique se 'json-summary' está em coverageReporters do Jest."

            exit 0

          fi

          COVERAGE=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")

          echo "Cobertura de linhas: $COVERAGE%"

          if [ "$COVERAGE" -lt 85 ]; then

            echo "::error::Cobertura ($COVERAGE%) abaixo do mínimo de 85%."

            exit 1

          fi

          echo "::notice::Cobertura ok: $COVERAGE%"



      - name: SonarCloud Scan

        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



      - name: Aguardar SonarCloud Quality Gate

        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b

        timeout-minutes: 5

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



      # Roda apenas quando um PR é mergeado na main

      - name: Exportar metrics.json

        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main'

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          PROJECT_KEY: fga-eps-mds_2026-2-AnatoQuizUp-Quiz-Service

        run: |

          # Nome: fga-eps-mds-2026_2_UNB-AnatoQuizUp-Quiz-Service-MM-DD-YYYY-HH-MM-SS-vX.Y.Z.json
          SEMESTER="2026_2"

          PROJECT_NAME="AnatoQuizUp"

          REPO_NAME="Quiz-Service"

          DATE_HORA=$(date -u +"%m-%d-%Y-%H-%M-%S")

          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")

          VERSAO_RELEASE="v${VERSION}"

          FILENAME="fga-eps-mds-${SEMESTER}_UNB-${PROJECT_NAME}-${REPO_NAME}-${DATE_HORA}-${VERSAO_RELEASE}.json"



          # component_tree retorna métricas por arquivo/diretório — necessário para o notebook

          METRIC_LIST="files,functions,complexity,comment_lines_density,duplicated_lines_density,coverage,ncloc,tests,test_errors,test_failures,test_execution_time,security_rating"

          curl -s -u "$SONAR_TOKEN:" \

            "https://sonarcloud.io/api/measures/component_tree?component=${PROJECT_KEY}&metricKeys=${METRIC_LIST}&qualifiers=FIL,DIR,UTS&ps=500&strategy=leaves" \

            -o raw.json



          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "{\"timestamp\":\"$TIMESTAMP\",\"commit\":\"${{ github.sha }}\",\"filename\":\"$FILENAME\",\"data\":$(cat raw.json)}" > "$FILENAME"

          echo "METRICS_FILE=$FILENAME" >> $GITHUB_ENV

          cat "$FILENAME"



      - name: Upload metrics.json (artefato)

        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main'

        uses: actions/upload-artifact@v4

        with:

          name: metrics-quiz-service-${{ github.sha }}

          path: ${{ env.METRICS_FILE }}

          retention-days: 90



      - name: Publicar metrics.json em analytics-raw-data no repo de Doc

        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main'

        env:

          DOC_PUSH_TOKEN: ${{ secrets.DOC_PUSH_TOKEN }}

        run: |

          if [ -z "$DOC_PUSH_TOKEN" ]; then

            echo "::warning::Secret DOC_PUSH_TOKEN não configurada — pulando commit no repo de doc."

            exit 0

          fi

          git clone --depth 1 https://x-access-token:$DOC_PUSH_TOKEN@github.com/fga-eps-mds/2026-2-AnatoQuizUp-Doc.git doc-repo

          cd doc-repo

          mkdir -p analytics-raw-data/quiz-service

          cp "../${{ env.METRICS_FILE }}" "analytics-raw-data/quiz-service/${{ env.METRICS_FILE }}"

          cp "../${{ env.METRICS_FILE }}" analytics-raw-data/quiz-service/latest.json

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add analytics-raw-data/

          git commit -m "chore(metrics): atualiza metricas quiz-service ${{ env.METRICS_FILE }} [skip ci]" || echo "Sem mudancas para commitar."
          git push

